    minY = Math.min(minY, a.y - (a.fontSize || 10));
    maxX = Math.max(maxX, a.x + aw / 2);
    maxY = Math.max(maxY, a.y + (a.fontSize || 10));
  });
  state.lines.forEach(function(ln) {
    if (!ln.points) return;
    ln.points.forEach(function(pt) {
      minX = Math.min(minX, pt[0]); minY = Math.min(minY, pt[1]);
      maxX = Math.max(maxX, pt[0]); maxY = Math.max(maxY, pt[1]);
    });
    if (ln.curve) {
      var cps = normalizeCurve(ln) || [];
      cps.forEach(function(cp) {
        minX = Math.min(minX, cp[0]); minY = Math.min(minY, cp[1]);
        maxX = Math.max(maxX, cp[0]); maxY = Math.max(maxY, cp[1]);
      });
    }
  });
  // Include arrow paths from route cache
  state.arrows.forEach(function(arr) {
    var pts = _routeCache[arr.id];
    if (!pts) return;
    pts.forEach(function(pt) {
      minX = Math.min(minX, pt[0]); minY = Math.min(minY, pt[1]);
      maxX = Math.max(maxX, pt[0]); maxY = Math.max(maxY, pt[1]);
    });
  });

  if (minX === Infinity) { minX = 0; minY = 0; maxX = 800; maxY = 600; }
  var vw = maxX - minX + PAD * 2;
  var vh = maxY - minY + PAD * 2;
  var vx = minX - PAD;
  var vy = minY - PAD;

  // Set viewBox to fit content, then clone
  var origVB = canvas.getAttribute('viewBox');
  canvas.setAttribute('viewBox', vx + ' ' + vy + ' ' + vw + ' ' + vh);
  var svgClone = canvas.cloneNode(true);
  canvas.setAttribute('viewBox', origVB); // restore

  svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  svgClone.setAttribute('width', vw);
  svgClone.setAttribute('height', vh);

  // Remove grid rect (child index 2)
  var gridRect = svgClone.children[2];
  if (gridRect && gridRect.getAttribute('fill') === 'url(#grid)') {
    svgClone.removeChild(gridRect);
  }

  // Resize white bg rect to match content bounds
  var bgRect = svgClone.children[1];
  if (bgRect) {
    bgRect.setAttribute('x', vx); bgRect.setAttribute('y', vy);
    bgRect.setAttribute('width', vw); bgRect.setAttribute('height', vh);
  }

  var blob = new Blob([svgClone.outerHTML], { type: 'image/svg+xml' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = (_sourceFile || 'patent-figure').replace('.json', '') + '.svg'; a.click();
  URL.revokeObjectURL(url);
}

function buildExportSpec() {
  return {
    title: '',
    width: parseInt(canvas.getAttribute('width')),
    height: parseInt(canvas.getAttribute('height')),
    elements: state.elements.map(function(el) {
      var o = { id: el.numeral || undefined, label: el.label, position: [el.x, el.y], width: el.w, height: el.h };
      if (el.type === 'diamond') o.shape = 'diamond';
      if (el.style === 'dashed') o.style = 'dashed';
      if (el.rotation) o.rotation = el.rotation;
      return o;
    }),
    arrows: state.arrows.map(function(arr) {
      var fromEl = state.elements.find(function(e) { return e.id === arr.fromId; });
      var toEl = state.elements.find(function(e) { return e.id === arr.toId; });
      var o = { from: fromEl?.numeral || arr.fromId, to: toEl?.numeral || arr.toId };
      if (arr.style !== 'solid') o.style = arr.style;
      if (arr.label) o.label = arr.label;
      var tips = arr.tips || (arr.bidirectional ? 'both' : 'end');
      if (tips !== 'end') o.tips = tips;
      if (arr.waypoints && arr.waypoints.length) o.waypoints = arr.waypoints;
      if (arr.fromAnchor) o.fromAnchor = arr.fromAnchor;
      if (arr.toAnchor) o.toAnchor = arr.toAnchor;
      if (arr.labelOffset && (arr.labelOffset[0] !== 0 || arr.labelOffset[1] !== 0)) o.labelOffset = arr.labelOffset;
      return o;
    }),
    annotations: state.annotations.map(function(a) {
      var o = { text: a.text, position: [a.x, a.y] };
      if (a.fontSize && a.fontSize !== 10) o.fontSize = a.fontSize;
      if (a.bold) o.bold = true;
      return o;
    }),
    lines: state.lines.map(function(l) {
      if (l.points) {
        var o = { points: l.points };
        if (l.style === 'dashed') o.style = 'dashed';
        if (l.tips && l.tips !== 'none') o.tips = l.tips;
        if (l.curve) o.curve = l.curve;
        return o;
      }
      var o = { from: [l.x1, l.y1], to: [l.x2, l.y2] };
      if (l.style === 'dashed') o.style = 'dashed';
      if (l.tips && l.tips !== 'none') o.tips = l.tips;
      if (l.curve) o.curve = l.curve;
      return o;
    }),
  };
}

function exportJSON() {
  var spec = buildExportSpec();
  var blob = new Blob([JSON.stringify(spec, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = _sourceFile || 'patent-figure.json'; a.click();
  URL.revokeObjectURL(url);
}

var _sourceFile = null; // display name for status
var _fileHandle = null; // File System Access API handle for overwrite
var _projectHandle = null; // File System Access API handle for project file

function showSaveButton(name) {
  _sourceFile = name;
  var btn = document.getElementById('btn-save');
  btn.style.display = 'block';
  btn.title = 'Save to ' + name;
}

function handleImportedJSON(parsed, fileName) {
  if (parsed.type === 'inventorlab-project' && parsed.pages) {
    // Project file — load all pages as tabs
    savePageState();
    pages = [];
    parsed.pages.forEach(function(pg, i) {
      pages.push({ name: pg.name || ('Page ' + (i + 1)), elements: [], arrows: [], annotations: [], lines: [], groups: [] });
      activePage = i;
      loadPageState(i);
      loadSpec(pg.spec || pg);
      savePageState();
    });
    activePage = 0;
    loadPageState(0);
    render();
    renderProps(null);
    renderTabs();
    fitToScreen();
    // Show Save Project button if we have a file handle
    if (_projectHandle || _fileHandle) {
      document.getElementById('btn-save-project').style.display = 'block';
      document.getElementById('btn-save-project').title = 'Save to ' + (_projectHandle || _fileHandle).name;
      if (!_projectHandle) _projectHandle = _fileHandle;
    }
    document.getElementById('status-info').textContent = 'Loaded project: ' + pages.length + ' pages';
  } else {
    // Single figure — load into current tab
    loadSpec(parsed);
    var name = (parsed.title || fileName || '').replace(/\.json$/i, '');
    if (name) pages[activePage].name = name;
    savePageState();
    renderTabs();
    showSaveButton(fileName);
    document.getElementById('status-info').textContent = 'Loaded ' + fileName;
  }
}

function importJSON() {
  // Try File System Access API first (allows save-back to same file)
  if (window.showOpenFilePicker) {
    window.showOpenFilePicker({
      multiple: true,
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    }).then(function(handles) {
      if (handles.length === 1) {
        var handle = handles[0];
        _fileHandle = handle;
        return handle.getFile().then(function(file) {
          return file.text().then(function(text) {
            var parsed = JSON.parse(text);
            if (parsed.type === 'inventorlab-project') _projectHandle = handle;
            handleImportedJSON(parsed, handle.name);
          });
        });
      } else {
        // Multiple files — each becomes a tab
        savePageState();
        var isFirst = (pages.length === 1 && pages[0].elements.length === 0);
        var startIdx = isFirst ? 0 : pages.length;
        var promises = handles.map(function(h) {
          return h.getFile().then(function(f) {
            return f.text().then(function(t) { return { name: h.name, spec: JSON.parse(t) }; });
          });
        });
        return Promise.all(promises).then(function(results) {
          results.sort(function(a, b) { return a.name.localeCompare(b.name); });
          results.forEach(function(r, i) {
            var pgIdx = startIdx + i;
            var name = (r.spec.title || r.name || '').replace(/\.json$/i, '');
            if (pgIdx < pages.length) {
              pages[pgIdx].name = name;
            } else {
              pages.push({ name: name, elements: [], arrows: [], annotations: [], lines: [], groups: [] });
            }
            activePage = pgIdx;
            loadPageState(pgIdx);
            loadSpec(r.spec);
            savePageState();
          });
          activePage = startIdx;
          loadPageState(activePage);
          render();
          renderProps(null);
          renderTabs();
          fitToScreen();
          document.getElementById('status-info').textContent = 'Loaded ' + results.length + ' figures as tabs';
        });
      }
    }).catch(function(err) {
      if (err.name !== 'AbortError') alert('Failed to load: ' + err.message);
    });
  } else {
    // Fallback for browsers without File System Access API
    var input = document.createElement('input');
    input.type = 'file'; input.accept = '.json'; input.multiple = true;
    input.onchange = function() {
      var files = Array.from(input.files);
      if (files.length === 1) {
        var reader = new FileReader();
        reader.onload = function(e) {
          try { handleImportedJSON(JSON.parse(e.target.result), files[0].name); }
          catch(err) { alert('Invalid JSON: ' + err.message); }
        };
        reader.readAsText(files[0]);
      } else {
        // Multiple files
        savePageState();
        var isFirst = (pages.length === 1 && pages[0].elements.length === 0);
        var startIdx = isFirst ? 0 : pages.length;
        files.sort(function(a, b) { return a.name.localeCompare(b.name); });
        var loaded = 0;
        files.forEach(function(file, i) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var pgIdx = startIdx + i;
            var spec = JSON.parse(e.target.result);
            var name = (spec.title || file.name || '').replace(/\.json$/i, '');
            if (pgIdx < pages.length) {
              pages[pgIdx].name = name;
            } else {
              pages.push({ name: name, elements: [], arrows: [], annotations: [], lines: [], groups: [] });
            }
            activePage = pgIdx;
            loadPageState(pgIdx);
            loadSpec(spec);
            savePageState();
            loaded++;
            if (loaded === files.length) {
              activePage = startIdx;
              loadPageState(activePage);
              render(); renderProps(null); renderTabs(); fitToScreen();
              document.getElementById('status-info').textContent = 'Loaded ' + files.length + ' figures as tabs';
            }
          };
          reader.readAsText(file);
        });
      }
    };
    input.click();
  }
}

function saveJSON() {
  if (!_sourceFile) return;
  var spec = buildExportSpec();
  var json = JSON.stringify(spec, null, 2);

  if (_fileHandle) {
    // Overwrite the original file in place
    _fileHandle.createWritable().then(function(writable) {
      return writable.write(json).then(function() { return writable.close(); });
    }).then(function() {
      document.getElementById('status-info').textContent = 'Saved ' + _sourceFile;
    }).catch(function(err) {
      alert('Save failed: ' + err.message);
    });
  } else {
    // Fallback: download
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = _sourceFile; a.click();
    URL.revokeObjectURL(url);
    document.getElementById('status-info').textContent = 'Saved ' + _sourceFile;
  }
}

function saveProject() {
  savePageState();
  var project = {
    type: 'inventorlab-project',
    pages: pages.map(function(pg) {
      return { name: pg.name, spec: buildPageSpec(pg) };
    })
  };
  var json = JSON.stringify(project, null, 2);

  if (_projectHandle) {
    _projectHandle.createWritable().then(function(writable) {
      return writable.write(json).then(function() { return writable.close(); });
    }).then(function() {
      document.getElementById('status-info').textContent = 'Project saved (' + pages.length + ' pages)';
    }).catch(function(err) {
      alert('Save failed: ' + err.message);
    });
  } else {
    // Fallback: download
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'project.json'; a.click();
    URL.revokeObjectURL(url);
    document.getElementById('status-info').textContent = 'Project saved (' + pages.length + ' pages)';
  }
}

function loadSpec(spec) {
  state.elements = [];
  state.arrows = [];
  state.annotations = [];
  state.lines = [];
  state._layoutDone = false; // trigger layout pass on next render
  state.selected = null;
  state.nextId = 1;

  // Build id map for arrows
  var idMap = {};

  // First pass: create all elements
  (spec.elements || []).forEach(function(el) {
    var id = genId();
    var numeral = el.id || '';
    idMap[numeral] = id;
    state.elements.push({
      id: id, type: el.shape || 'box', label: el.label || '', numeral: numeral,
      x: el.position[0], y: el.position[1],
      w: el.width || 160, h: el.height || (el.shape === 'diamond' ? 80 : 50),
      style: el.style || 'solid',
      _specParent: el.parent || null,   // explicit parent id from JSON
      _specRow: el.row || null,         // explicit row group from JSON
      _specLayout: el.layout || null,   // child layout direction: "horizontal" or "vertical"
      _specAlign: el.align || null,     // row alignment hint: "top", "center", "bottom"
      rotation: el.rotation || undefined,
    });
  });

  (spec.arrows || []).forEach(function(arr) {
    var fromId = idMap[arr.from] || arr.from;
    var toId = idMap[arr.to] || arr.to;
    var a = {
      id: genId(), type: 'arrow', fromId: fromId, toId: toId,
      waypoints: arr.waypoints || [],
      style: arr.style || 'solid', label: arr.label || '',
      tips: arr.tips || (arr.bidirectional ? 'both' : 'end'),
    };
    // Don't load fromAnchor/toAnchor from JSON — let the router optimize freely.
    // The old JSON files may have anchors set by a broken router.
    // Users can manually set anchors via the properties panel after loading.
    if (arr.labelOffset) a.labelOffset = arr.labelOffset;
    state.arrows.push(a);
  });

  (spec.annotations || []).forEach(function(a) {
    var ann = {
      id: genId(), type: 'annotation',
      text: Array.isArray(a.text) ? a.text.join(' ') : (a.text || ''),
      x: a.position[0], y: a.position[1],
      fontSize: a.fontSize || 10,
      bold: a.bold || false,
    };
    // attachTo: position relative to a specific element
    if (a.attachTo && idMap[a.attachTo]) {
      ann._attachTo = idMap[a.attachTo];
      var attachEl = state.elements.find(function(e) { return e.id === ann._attachTo; });
      if (attachEl) {
        ann._relX = ann.x - attachEl.x;
        ann._relY = ann.y - attachEl.y;
      }
    }
    state.annotations.push(ann);
  });

  (spec.lines || []).forEach(function(l) {
    if (l.points) {
      var lineObj = {
        id: genId(), type: 'line',
        points: l.points,
        style: l.style || 'solid',
        tips: l.tips || 'none',
      };
      if (l.curve) lineObj.curve = l.curve;
      state.lines.push(lineObj);
    } else {
      var lineObj = {
        id: genId(), type: 'line',
        points: [l.from, l.to],
        style: l.style || 'solid',
        tips: l.tips || 'none',
      };
      if (l.curve) lineObj.curve = l.curve;
      state.lines.push(lineObj);
    }
  });

  render();
  fitToScreen();
  renderProps(null);
}

function fitToScreen() {
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  state.elements.forEach(function(el) {
    minX = Math.min(minX, el.x - el.w/2);
    maxX = Math.max(maxX, el.x + el.w/2);
    minY = Math.min(minY, el.y - el.h/2);
    maxY = Math.max(maxY, el.y + el.h/2);
  });
  state.annotations.forEach(function(a) {
    minX = Math.min(minX, a.x - 50);
    maxX = Math.max(maxX, a.x + 50);
    minY = Math.min(minY, a.y - 10);
    maxY = Math.max(maxY, a.y + 10);
  });
  state.lines.forEach(function(ln) {
    (ln.points || []).forEach(function(pt) {
      minX = Math.min(minX, pt[0]); maxX = Math.max(maxX, pt[0]);
      minY = Math.min(minY, pt[1]); maxY = Math.max(maxY, pt[1]);
    });
  });
  if (minX === Infinity) return;

  var PAD = 40;
  minX -= PAD; minY -= PAD; maxX += PAD; maxY += PAD;
  var contentW = maxX - minX, contentH = maxY - minY;
  var r = canvasWrap.getBoundingClientRect();
  var fitZoom = Math.min(r.width / contentW, r.height / contentH) * 0.9;
  fitZoom = Math.max(0.2, Math.min(3, fitZoom));

  view.zoom = fitZoom;
  view.x = minX + contentW/2 - r.width / fitZoom / 2;
  view.y = minY + contentH/2 - r.height / fitZoom / 2;
  updateViewBox();
}

function clearAll() {
  if (!confirm('Clear this page?')) return;
  state.elements = []; state.arrows = []; state.annotations = []; state.lines = []; state.groups = [];
  state.selected = null;
  state._layoutDone = false;
  savePageState();
  render();
  renderProps(null);
}

// ══════════════════════════════════════════════════════════════
// TAB / PAGE SYSTEM
// ══════════════════════════════════════════════════════════════

var pages = [{ name: 'Page 1', elements: [], arrows: [], annotations: [], lines: [], groups: [] }];
var activePage = 0;

function savePageState() {
  pages[activePage].elements = JSON.parse(JSON.stringify(state.elements, _stripCircular));
  pages[activePage].arrows = JSON.parse(JSON.stringify(state.arrows, _stripCircular));
  pages[activePage].annotations = JSON.parse(JSON.stringify(state.annotations, _stripCircular));
  pages[activePage].lines = JSON.parse(JSON.stringify(state.lines, _stripCircular));
  pages[activePage].groups = JSON.parse(JSON.stringify(state.groups || [], _stripCircular));
}

function loadPageState(idx) {
  var pg = pages[idx];
  state.elements = JSON.parse(JSON.stringify(pg.elements || []));
  state.arrows = JSON.parse(JSON.stringify(pg.arrows || []));
  state.annotations = JSON.parse(JSON.stringify(pg.annotations || []));
  state.lines = JSON.parse(JSON.stringify(pg.lines || []));
  state.groups = JSON.parse(JSON.stringify(pg.groups || []));
  state.selected = null;
  state.multiSelect = [];
  state._layoutDone = true; // already laid out when saved
  view.zoom = 1; view.x = 0; view.y = 0;
  updateViewBox();
}

function switchPage(idx) {
  if (idx === activePage) return;
  savePageState();
  activePage = idx;
  loadPageState(idx);
  render();
  renderProps(null);
  renderTabs();
  fitToScreen();
}

function addPage(name) {
  savePageState();
  pages.push({ name: name || 'Page ' + (pages.length + 1), elements: [], arrows: [], annotations: [], lines: [], groups: [] });
  activePage = pages.length - 1;
  loadPageState(activePage);
  render();
  renderProps(null);
  renderTabs();
}

function removePage(idx) {
  if (pages.length <= 1) return;
  if (!confirm('Delete "' + pages[idx].name + '"?')) return;
  pages.splice(idx, 1);
  if (activePage >= pages.length) activePage = pages.length - 1;
  loadPageState(activePage);
  render();
  renderProps(null);
  renderTabs();
}

function renamePage(idx) {
  var name = prompt('Page name:', pages[idx].name);
  if (name && name.trim()) {
    pages[idx].name = name.trim();
    renderTabs();
  }
}

function renderTabs() {
  var bar = document.getElementById('tab-bar');
  var html = '';
  for (var i = 0; i < pages.length; i++) {
    html += '<div class="tab' + (i === activePage ? ' active' : '') + '" onclick="switchPage(' + i + ')" ondblclick="renamePage(' + i + ')">';
    html += '<span>' + escHtml(pages[i].name) + '</span>';
    if (pages.length > 1) html += '<span class="tab-close" onclick="event.stopPropagation();removePage(' + i + ')">×</span>';
    html += '</div>';
  }
  html += '<div class="tab-add" onclick="addPage()" title="Add page">+</div>';
  bar.innerHTML = html;
}

function exportProjectJSON() {
  savePageState();
  var project = {
    type: 'inventorlab-project',
    pages: pages.map(function(pg) {
      return {
        name: pg.name,
        spec: buildPageSpec(pg)
      };
    })
  };
  var blob = new Blob([JSON.stringify(project, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'patent-figures-project.json'; a.click();
  URL.revokeObjectURL(url);
}

function buildPageSpec(pg) {
  // Build export spec from a page's data (not necessarily the active state)
  var saved = {
    elements: state.elements, arrows: state.arrows,
    annotations: state.annotations, lines: state.lines, groups: state.groups
  };
  state.elements = pg.elements || [];
  state.arrows = pg.arrows || [];
  state.annotations = pg.annotations || [];
  state.lines = pg.lines || [];
  state.groups = pg.groups || [];
  var spec = buildExportSpec();
  state.elements = saved.elements; state.arrows = saved.arrows;
  state.annotations = saved.annotations; state.lines = saved.lines; state.groups = saved.groups;
  return spec;
}

function exportPDF() {
  savePageState();
  // Load jsPDF from CDN if not already loaded
  if (!window.jspdf) {
    var script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    script.onload = function() { doExportPDF(); };
    document.head.appendChild(script);
  } else {
    doExportPDF();
  }
}

function doExportPDF() {
  var jsPDF = window.jspdf.jsPDF;
  var pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });
  var pageW = pdf.internal.pageSize.getWidth();
  var pageH = pdf.internal.pageSize.getHeight();
  var PAD = 40;

  // Save current state
  var origPage = activePage;
  var origState = {
    elements: state.elements, arrows: state.arrows,
    annotations: state.annotations, lines: state.lines, groups: state.groups
  };

  for (var pi = 0; pi < pages.length; pi++) {
    if (pi > 0) pdf.addPage();

    // Load page state and render
    loadPageState(pi);
    selectElement(null);
    render();

    // Build SVG string without grid
    var svgClone = canvas.cloneNode(true);
    svgClone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    // Remove grid rect
    var gridRect = svgClone.children[2];
    if (gridRect && gridRect.getAttribute('fill') === 'url(#grid)') svgClone.removeChild(gridRect);

    // Compute bounds from page data
    var pg = pages[pi];
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    (pg.elements || []).forEach(function(el) {
      minX = Math.min(minX, el.x - el.w/2); minY = Math.min(minY, el.y - el.h/2);
      maxX = Math.max(maxX, el.x + el.w/2); maxY = Math.max(maxY, el.y + el.h/2);
    });
    (pg.annotations || []).forEach(function(a) {
      var aw = Math.max(40, (a.text || '').length * ((a.fontSize || 10) * 0.6));
      minX = Math.min(minX, a.x - aw/2); minY = Math.min(minY, a.y - (a.fontSize || 10));
      maxX = Math.max(maxX, a.x + aw/2); maxY = Math.max(maxY, a.y + (a.fontSize || 10));
    });
    (pg.lines || []).forEach(function(ln) {
      (ln.points || []).forEach(function(pt) {
        minX = Math.min(minX, pt[0]); minY = Math.min(minY, pt[1]);
        maxX = Math.max(maxX, pt[0]); maxY = Math.max(maxY, pt[1]);
      });
    });
    state.arrows.forEach(function(arr) {
      var pts = _routeCache[arr.id];
      if (pts) pts.forEach(function(pt) {
        minX = Math.min(minX, pt[0]); minY = Math.min(minY, pt[1]);
        maxX = Math.max(maxX, pt[0]); maxY = Math.max(maxY, pt[1]);
      });
    });
    if (minX === Infinity) { minX = 0; minY = 0; maxX = 800; maxY = 600; }

    var svgW = maxX - minX + PAD * 2;
    var svgH = maxY - minY + PAD * 2;
    svgClone.setAttribute('viewBox', (minX - PAD) + ' ' + (minY - PAD) + ' ' + svgW + ' ' + svgH);
    svgClone.setAttribute('width', svgW);
    svgClone.setAttribute('height', svgH);
    // Resize bg rect
    var bgRect = svgClone.children[1];
    if (bgRect) {
      bgRect.setAttribute('x', minX - PAD); bgRect.setAttribute('y', minY - PAD);
      bgRect.setAttribute('width', svgW); bgRect.setAttribute('height', svgH);
    }

    // Scale to fit PDF page
    var scale = Math.min((pageW - PAD * 2) / svgW, (pageH - PAD * 2) / svgH);
    var drawW = svgW * scale, drawH = svgH * scale;
    var ox = (pageW - drawW) / 2, oy = (pageH - drawH) / 2;

    // Convert SVG to data URL and add to PDF
    var svgData = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgClone.outerHTML)));
    var img = new Image();
    img.src = svgData;
    pdf.addSvgAsImage(svgClone.outerHTML, ox, oy, drawW, drawH);
  }

  // Restore original state
  state.elements = origState.elements; state.arrows = origState.arrows;
  state.annotations = origState.annotations; state.lines = origState.lines;
  state.groups = origState.groups;
  activePage = origPage;
  render();

  pdf.save('patent-figures.pdf');
  document.getElementById('status-info').textContent = 'Exported ' + pages.length + ' page(s) to PDF';
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Initial render
renderTabs();
render();

// Auto-load spec from ?file= URL parameter
(function() {
  var params = new URLSearchParams(window.location.search);
  var filePath = params.get('file');
  if (filePath) {
    fetch(filePath).then(function(r) { return r.json(); }).then(function(spec) {
      handleImportedJSON(spec, filePath.split('/').pop());
    }).catch(function(err) {
      document.getElementById('status-info').textContent = 'Failed to load ' + filePath;
    });
  }
})();
</script>
